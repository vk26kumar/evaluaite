version: 2
updates:
  - package-ecosystem: npm
    directory: /BACKEND
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(backend)"
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /FRONTEND
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(frontend)"
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions:
        patterns: ["*"]
